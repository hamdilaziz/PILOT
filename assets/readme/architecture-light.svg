<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-labelledby="title description"><title id="title">PILOT architecture</title><desc id="description">The image passes through the CNN encoder and 2D positional encoding. The task prompt and visual features condition the four-layer mBART decoder, which generates interleaved text and layout tokens.</desc><rect x="0" y="0" width="1280" height="270" rx="20" fill="#F3F7FC" stroke="none" /><text x="32" y="39" fill="#526A83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">FROM PIXELS TO A STRUCTURED SEQUENCE</text><rect x="32" y="119" width="158" height="96" rx="12" fill="#FFFFFF" stroke="#D7E3EF" /><rect x="50" y="137" width="25" height="3" rx="1" fill="#122743" stroke="none" /><text x="50" y="167" fill="#122743" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" >Document</text><text x="50" y="193" fill="#526A83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" >RGB image</text><rect x="252" y="119" width="247" height="96" rx="12" fill="#FFFFFF" stroke="#D7E3EF" /><rect x="270" y="137" width="25" height="3" rx="1" fill="#2563EB" stroke="none" /><text x="270" y="167" fill="#122743" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" >CNN encoder</text><text x="270" y="193" fill="#526A83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" >Visual features + 2D positions</text><rect x="561" y="119" width="239" height="96" rx="12" fill="#FFFFFF" stroke="#D7E3EF" /><rect x="579" y="137" width="25" height="3" rx="1" fill="#087F78" stroke="none" /><text x="579" y="167" fill="#122743" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" >mBART decoder</text><text x="579" y="193" fill="#526A83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" >4 layers · cross-attention</text><rect x="862" y="119" width="386" height="96" rx="12" fill="#FFFFFF" stroke="#D7E3EF" /><rect x="880" y="137" width="25" height="3" rx="1" fill="#7252C9" stroke="none" /><text x="880" y="167" fill="#122743" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" >Text + layout tokens</text><text x="880" y="193" fill="#526A83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" >Autoregressive output sequence</text><path d="M202 167H238m-7-5 7 5-7 5" fill="none" stroke="#526A83" stroke-width="1.7"/><path d="M511 167H547m-7-5 7 5-7 5" fill="none" stroke="#526A83" stroke-width="1.7"/><path d="M812 167H848m-7-5 7 5-7 5" fill="none" stroke="#526A83" stroke-width="1.7"/><rect x="594" y="61" width="173" height="36" rx="8" fill="#FFFFFF" stroke="#087F78" /><text x="617" y="85" fill="#087F78" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="500" >Task prompt</text><path d="M680 98V115m-4-5 4 5 4-5" fill="none" stroke="#087F78" stroke-width="1.7"/></svg>
